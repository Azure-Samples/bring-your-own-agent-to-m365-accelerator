[project]
name = "data-ingestion"
version = "0.1.0"
description = "Azure AI Search data ingestion – indexes Excel, Word and PDF files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "azure-search-documents>=11.6.0",
    "azure-identity>=1.19.0",
    "azure-core>=1.32.0",
    "openai>=2.24.0",
    "python-dotenv>=1.1.0",
    "PyMuPDF>=1.25.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
]

[project.scripts]
ingest = "ingest:main"

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
