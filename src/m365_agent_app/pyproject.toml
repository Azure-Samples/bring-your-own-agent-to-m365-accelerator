[project]
name = "m365-agent-app"
version = "0.1.0"
description = "M365 Agent Application"
readme = "README.md"
requires-python = ">=3.13, <4.0.0"
dependencies = [
    "microsoft-agents-hosting-aiohttp==0.8.0",
    "microsoft-agents-hosting-core==0.8.0",
    "microsoft-agents-activity==0.8.0",
    "microsoft-agents-authentication-msal==0.8.0",
    "azure-identity==1.25.1",
    "aiohttp==3.13.0",
    "python-dotenv==1.1.1",
    "agent-framework==1.0.0rc2",
    "agent-framework-azure-ai==1.0.0rc2",
    "agent-framework-core==1.0.0rc2",
    "agent-framework-devui==1.0.0b260225",
    "azure-monitor-opentelemetry-exporter>=1.0.0b46",
    "azure-ai-projects==2.0.0b3",
    "pydantic>=2.12.4",
]

# Explicit package discovery to avoid setuptools flat-layout error.
# We deliberately ship the two top-level packages used by the runtime.
# If we later refactor into a src/ layout, this section can be removed
# in favor of a find directive pointing at src/m365_agent_app.
[tool.setuptools]
packages = [
    "bootstrap",
    "models",
    "tools"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
